#
# Every option is optional; the defaults are shown. A copy in
# ~/.config/speech-dispatcher/modules/mbrola_ng.conf takes precedence over
# /etc/speech-dispatcher/modules/mbrola_ng.conf.
# Restart Speech Dispatcher after a change: killall speech-dispatcher

# Voice used when the client asks for no particular voice or language
# (a voice id: cr1, us1, us2, us3, en1). Default: the first installed voice.
#MbrolaNgDefaultVoice "cr1"

# Who reads punctuation: "server" = Speech Dispatcher's symbol
# preprocessing (the same symbol names as for every other synthesizer),
# "module" = MBROLA NG's own language data (punctuation level from the
# client: none / some / most / all).
#MbrolaNgPunctuation "server"

# Read emoji by their names (Unicode CLDR).
#MbrolaNgReadEmoji 1

# Read all numbers digit by digit.
#MbrolaNgDigitByDigit 0

# Speed at the highest rate (+100), in percent of the normal speed (100 - 800).
#MbrolaNgMaxRate 400

# Additional voice folders (separated by ':'), searched before the standard
# ones: ~/.local/share/mbrola-ng/voices, /usr/local/share/mbrola-ng/voices,
# <datadir>/voices and the distribution's /usr/share/mbrola.
#MbrolaNgVoicePath ""

# Developer options: other data folder / synthesizer (e.g. a build tree).
#MbrolaNgDataDir "/usr/share/mbrola-ng"
#MbrolaNgSynth "/usr/libexec/mbrola-ng/mbrola_ng_synth"

# Messages to the module log (~/.cache/speech-dispatcher/log/mbrola_ng.log).
Debug 0
