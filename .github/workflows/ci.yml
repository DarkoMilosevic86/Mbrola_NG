#
# Compiles every language (langc runs the language's tests.txt through the
# real engine), runs the unit tests and validates the voice catalog. The
# platform builds (Android, Apple, installer, NVDA add-on) need their own
# toolchains and are not part of this check.
name: CI

on:
  push:
    branches: [dev, master]
  pull_request:

permissions:
  contents: read

jobs:
  languages-and-catalog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate the voice catalog
        run: python3 tools/check_catalog.py

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build the language compiler and the unit tests
        run: cmake --build build --target langc mbtts test_ssml -j 4

      - name: Test every language and the SSML parser
        run: ctest --test-dir build --output-on-failure
